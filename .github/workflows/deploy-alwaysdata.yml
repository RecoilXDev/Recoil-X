name: Deploy RECOIL X to Alwaysdata

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'recoil-icon-*.png'
      - 'server/**'
      - '.github/workflows/deploy-alwaysdata.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recoil-x-alwaysdata
  cancel-in-progress: false

jobs:
  deploy:
    # Intentionally disabled until the owner configures the secrets below.
    if: ${{ vars.RECOIL_X_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out RECOIL X
        uses: actions/checkout@v4

      - name: Validate deployment settings
        env:
          DEPLOY_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ALWAYSDATA_SSH_KNOWN_HOSTS }}
          API_KEY: ${{ secrets.ALWAYSDATA_API_KEY }}
          SITE_ID: ${{ vars.ALWAYSDATA_SITE_ID }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "Missing ALWAYSDATA_SSH_KEY"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "Missing ALWAYSDATA_SSH_KNOWN_HOSTS"; exit 1; }
          test -n "$API_KEY" || { echo "Missing ALWAYSDATA_API_KEY"; exit 1; }
          [[ "$SITE_ID" =~ ^[0-9]+$ ]] || { echo "ALWAYSDATA_SITE_ID must be numeric"; exit 1; }

      - name: Prepare verified SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ALWAYSDATA_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Select supported Node.js for validation
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install test dependencies
        run: npm install --prefix server --ignore-scripts --no-audit --no-fund

      - name: Validate server and game before deploying
        run: |
          for f in server/*.mjs server/*.js; do node --check "$f"; done
          node --test tests/*.test.mjs tests/*.test.cjs

      - name: Upload the game page and offline files
        run: |
          scp -4 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            index.html manifest.webmanifest sw.js recoil-icon-192.png recoil-icon-512.png \
            recoil-x@ssh-recoil-x.alwaysdata.net:/home/recoil-x/

      - name: Upload server code without deleting the player database
        run: |
          rsync -avz \
            -e "ssh -4 -o BatchMode=yes -o StrictHostKeyChecking=yes -i $HOME/.ssh/id_ed25519" \
            --exclude='node_modules/' --exclude='.env' \
            --exclude='*.sqlite*' --exclude='*.db*' \
            server/ recoil-x@ssh-recoil-x.alwaysdata.net:/home/recoil-x/recoilx-server/

      - name: Install required server dependencies
        run: |
          ssh -4 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            recoil-x@ssh-recoil-x.alwaysdata.net \
            'cd /home/recoil-x/recoilx-server && npm install --omit=dev --no-audit'

      - name: Restart RECOIL X site using Alwaysdata API
        env:
          API_KEY: ${{ secrets.ALWAYSDATA_API_KEY }}
          SITE_ID: ${{ vars.ALWAYSDATA_SITE_ID }}
        run: |
          curl --fail --silent --show-error --request POST --basic \
            --user "$API_KEY account=recoil-x:" \
            "https://api.alwaysdata.com/v1/site/$SITE_ID/restart/"
          echo "Alwaysdata accepted the RECOIL X restart request."

      - name: Check live website
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 3 --output /dev/null \
            https://recoil-x.alwaysdata.net/
          echo "RECOIL X website responded successfully."

      - name: Verify the deployed Z.5 assets and game modes
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
            --output /tmp/recoil-z5-live.html https://recoil-x.alwaysdata.net/
          grep -Fq 'OG Futuristic Arena' /tmp/recoil-z5-live.html
          grep -Fq 'Z.5 Search & Destroy' /tmp/recoil-z5-live.html
          grep -Fq 'rxSimpleQuick' /tmp/recoil-z5-live.html
          grep -Fq 'Classic · Random map · 5-minute battle' /tmp/recoil-z5-live.html
          grep -Fq 'const pool=MAPS.filter(m=>!m.mysteryOnly' /tmp/recoil-z5-live.html
          grep -Fq 'content="Z.5-SAND-6.1"' /tmp/recoil-z5-live.html
          grep -Fq '<title>RECOIL X Z.5 · Sand Edition</title>' /tmp/recoil-z5-live.html
          grep -Fq "querySelector('.brandchip').textContent='RECOIL X · VERSION Z.5'" /tmp/recoil-z5-live.html
          if grep -Fq "querySelector('.brandchip').textContent='Z.3'" /tmp/recoil-z5-live.html; then
            echo 'Legacy Z.3 startup branding unexpectedly present' >&2; exit 1
          fi
          grep -Fq 'localHeat:true' /tmp/recoil-z5-live.html
          curl --fail --silent --show-error --location \
            --output /tmp/recoil-z5-hub.js https://recoil-x.alwaysdata.net/z5-matchhub.js
          grep -Fq 'MATCH HUB' /tmp/recoil-z5-hub.js
          grep -Fq 'script src="/z5-ingame.js" defer' /tmp/recoil-z5-live.html
          curl --fail --silent --show-error --location \
            --output /tmp/recoil-z5-ingame.js https://recoil-x.alwaysdata.net/z5-ingame.js
          grep -Fq 'Career & Clans' /tmp/recoil-z5-ingame.js
          grep -Fq 'Forge & Market' /tmp/recoil-z5-ingame.js
          grep -Fq 'Match Hub' /tmp/recoil-z5-ingame.js
          grep -Fq 'Z.5-SAND-6.1' /tmp/recoil-z5-ingame.js
          grep -Fq 'rx5-release-strip' /tmp/recoil-z5-ingame.js
          grep -Fq 'rx5-sand-ui' /tmp/recoil-z5-ingame.js
          grep -Fq 'rx5PauseSettings' /tmp/recoil-z5-ingame.js
          grep -Fq 'rx5-quick-system' /tmp/recoil-z5-ingame.js
          grep -Fq 'window.RXZ5ClassicMenu={' /tmp/recoil-z5-live.html
          grep -Fq 'const api=window.RXZ5ClassicMenu' /tmp/recoil-z5-live.html
          grep -Fq 'rx5-sand-6-1-first-menu' /tmp/recoil-z5-live.html
          grep -Fq 'rx5LegacyMenuLink' /tmp/recoil-z5-ingame.js
          grep -Fq 'rxSimpleCollection' /tmp/recoil-z5-ingame.js
          grep -Fq 'COLLECTION' /tmp/recoil-z5-ingame.js
          grep -Fq 'more.append(hero)' /tmp/recoil-z5-ingame.js
          grep -Fq 'settings.hidden=true' /tmp/recoil-z5-ingame.js
          grep -Fq '#ffd08b' /tmp/recoil-z5-ingame.js
          if grep -Fq 'body.rx5-ui-polished #overlay' /tmp/recoil-z5-ingame.js; then echo 'Old navy design still active' >&2; exit 1; fi
          curl --fail --silent --show-error --location --output /tmp/recoil-z5-manifest.json https://recoil-x.alwaysdata.net/manifest.webmanifest
          grep -Fq '"theme_color": "#291c15"' /tmp/recoil-z5-manifest.json
          grep -Fq "window.RXZ5InGame={open,showNews,version:'Z.5-SAND-6.1'}" /tmp/recoil-z5-ingame.js
          grep -Fq 'rx5WhatsNew' /tmp/recoil-z5-ingame.js
          grep -Fq 'Training Academy' /tmp/recoil-z5-ingame.js
          grep -Fq 'EMP grenade (solo)' /tmp/recoil-z5-ingame.js
          grep -Fq 'Deployable shield (solo)' /tmp/recoil-z5-ingame.js
          grep -Fq 'function rx5AcademyFinish' /tmp/recoil-z5-live.html
          grep -Fq 'function rx5BlueprintWeapon' /tmp/recoil-z5-live.html
          grep -Fq 'rx5Portable:true' /tmp/recoil-z5-live.html
          curl --fail --silent --show-error --location \
            --output /tmp/recoil-z5-admin.js https://recoil-x.alwaysdata.net/admin-panel.js
          grep -Fq "api('me')" /tmp/recoil-z5-admin.js
          grep -Fq "data-rx-admin-only" /tmp/recoil-z5-admin.js
          if grep -Fq 'rx-admin-launch' /tmp/recoil-z5-admin.js; then
            echo 'Public admin launcher must not exist' >&2; exit 1
          fi
          curl --fail --silent --show-error --location \
            --output /tmp/recoil-z5-career.js https://recoil-x.alwaysdata.net/z5-panel.js
          grep -Fq 'window.RXZ5Career' /tmp/recoil-z5-career.js
          if grep -Fq 'Z.5 LAB' /tmp/recoil-z5-career.js; then
            echo 'Legacy LAB launcher must be removed' >&2; exit 1
          fi
          curl --fail --silent --show-error --location --output /tmp/recoil-z5-sw.js https://recoil-x.alwaysdata.net/sw.js
          grep -Fq 'z5-sand-6-1' /tmp/recoil-z5-sw.js
          curl --fail --silent --show-error --location --output /tmp/recoil-z5-health.json https://recoil-x.alwaysdata.net/rx-api/health
          grep -Fq '"recoil":"Z.5"' /tmp/recoil-z5-health.json
          echo "Z.5 clean UI build, active offline weapon heat, role-gated Admin and current service worker verified live."
