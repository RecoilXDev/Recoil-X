name: Update B preview regression
on:
  push:
    branches: [feature/update-b-preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-b-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    if: github.ref == 'refs/heads/feature/update-b-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --prefix server --ignore-scripts --no-audit --no-fund
      - name: Syntax and existing regression tests
        run: |
          for f in server/*.mjs server/*.js; do node --check "$f"; done
          node --test tests/*.test.mjs tests/*.test.cjs
      - name: Save offline visual preview
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RECOIL-X-B-lobby-preview
          path: preview/update-b-lobby.html
  windows:
    if: github.ref == 'refs/heads/feature/update-b-preview'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build desktop preview
        run: dotnet publish installers/windows/RecoilX.csproj -c Release -r win-x64 --self-contained true -o build/win
      - name: Build EXE setup (unsigned)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          & $iscc installers/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: RECOIL-X-B-Windows-unsigned-preview
          path: dist/*.exe
          if-no-files-found: error
  android:
    if: github.ref == 'refs/heads/feature/update-b-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug-signed APK for emulator
        working-directory: installers/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RECOIL-X-B-Android-debug-preview
          path: installers/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
