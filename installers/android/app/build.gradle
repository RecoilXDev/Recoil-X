plugins { id 'com.android.application' }
android {
 namespace 'net.recoilx.preview'
 compileSdk 35
 defaultConfig {
  applicationId 'net.recoilx.preview'
  minSdk 23
  targetSdk 35
  versionCode 200
  versionName '2.0.0-preview'
  def endpoint = providers.gradleProperty('rxGameUrl').orElse('http://10.0.2.2:8787/').get()
  if (!(endpoint ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?\// || endpoint == 'http://10.0.2.2:8787/')) throw new GradleException('Use an HTTPS origin or the emulator development server')
  buildConfigField 'String', 'GAME_URL', '"'+endpoint+'"'
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
